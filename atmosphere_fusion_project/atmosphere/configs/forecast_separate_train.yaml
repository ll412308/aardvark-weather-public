test_only: false

data:
  instruments:
    1bamua: "F:/lyh_data/data_latent/1bamua_latents.zarr"
  interval_hours: 6
  # Change to 1/2/4/6 depending on the forecast rollout training stage.
  rollout_steps: 4
  normalize_latents: true
  val_fraction: 0.1
  test_fraction: 0.1

model:
  # Must exactly match the fusion-reconstruction checkpoint architecture.
  atmosphere_dim: 64
  latent_levels: 2
  spatial_multiple: 9
  pressure_levels_hpa: null
  fusion_refine_blocks: 2
  swin:
    depth: 4
    num_heads: 4
    window_size: [2, 9, 9]
    mlp_ratio: 4.0
    drop: 0.0
    attn_drop: 0.0
    drop_path: 0.1

loss:
  # Lead-0 reconstruction modules are frozen and this loss is disabled.
  current_reconstruction_weight: 0.0
  forecast_weight: 1.0
  use_density_mask: false
  density_threshold: 1.0e-6

train:
  # Freeze adapters + fusion + instrument heads; train only Swin processor.
  training_mode: "forecast"
  epochs: 50
  batch_size: 1
  num_workers: 0
  max_steps_per_epoch: null
  max_validation_steps: null
  grad_clip: 1.0
  instrument_dropout: 0.15
  mixed_precision: true
  amp_dtype: "bfloat16"
  seed: 42
  deterministic: false
  validate_every_epochs: 1
  save_every_epochs: 2
  resume: false
  # Set this to fusion_reconstruction_train's best.pth. It loads weights only
  # and starts a fresh optimizer, scheduler, epoch counter and output folder.
  finetune_from: null
  device: "auto"
  pin_memory: true

optimizer:
  name: "adamw"
  lr: 2.0e-5
  weight_decay: 1.0e-4

scheduler:
  name: "warmup_cosine"
  warmup_epochs: 1
  min_lr: 1.0e-6

early_stopping:
  patience: 15
  min_delta: 1.0e-5

test:
  enabled: true
  # Test beyond the four training rollout steps.
  rollout_steps: 8
  batch_size: 1
  num_workers: 0
  max_steps: null

plot:
  enabled: true
  loss_enabled: true
  loss_log_scale: true
  validation_enabled: true
  test_enabled: true
  channels: [1]
  instruments: null
  max_future_steps: null

output:
  run_name: "atmosphere_forecast_separate"
  runs_dir: "runs"
