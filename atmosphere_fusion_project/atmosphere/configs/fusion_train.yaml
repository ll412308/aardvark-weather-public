test_only: false

data:
  instruments:
    1bamua: "F:/lyh_data/data_latent/1bamua_latents.zarr"
    # 后续把所有已经独立训练好 AE 的仪器 latent store 加进来：
    # 1bamub: "F:/lyh_data/latent_zarr/1bamub_latent.zarr"
    # mhs:    "F:/lyh_data/latent_zarr/mhs_latent.zarr"
    # atms:   "F:/lyh_data/latent_zarr/atms_latent.zarr"
    # cris:   "F:/lyh_data/latent_zarr/cris_latent.zarr"
    # conv:   "F:/lyh_data/latent_zarr/conventional_latent.zarr"
  interval_hours: 6
  # 先 1 步训练跑通；稳定后建议逐渐增加到 2/4/8。
  rollout_steps: 1
  normalize_latents: true
  val_fraction: 0.1
  test_fraction: 0.1

model:
  atmosphere_dim: 64
  latent_levels: 2
  spatial_multiple: 9    # 要求进入模型的输入的H,W为该数的倍数，例如181就不行，要插值到180
  # 如果你希望共同 latent 的垂直层有明确气压意义，在正式训练配置中填写。
  # null = 4 个 learned latent levels。
  # 若你决定使用物理气压层，例如 4 层，可改为 [1000, 700, 400, 200]。
  pressure_levels_hpa: null
  fusion_refine_blocks: 2
  swin:
    depth: 4
    num_heads: 4
    # 2° grid 先变为 H=90,W=180；(2,9,9) 在 L/H/W 上都无需 padding。
    window_size: [2, 9, 9]
    mlp_ratio: 4.0
    drop: 0.0
    attn_drop: 0.0
    drop_path: 0.1

loss:
  # t 时刻共同状态要能还原各仪器自身 latent。
  current_reconstruction_weight: 0.25
  # 真正预报损失：Swin 后的未来共同状态 -> 各仪器未来 latent。
  forecast_weight: 1.0
  # false: processed latent 的整张网格参与 loss；true: 仅原始 rho>阈值处参与。
  use_density_mask: false
  density_threshold: 1.0e-6

train:
  training_mode: "joint"  # joint | fusion_reconstruction | forecast
  epochs: 100
  batch_size: 2
  num_workers: 0
  max_steps_per_epoch: null
  max_validation_steps: null
  grad_clip: 1.0
  # 多仪器以后建议 0.1~0.3，使共同大气状态不依赖固定仪器组合。
  instrument_dropout: 0.15
  mixed_precision: true
  amp_dtype: "bfloat16"
  seed: 42
  deterministic: false
  validate_every_epochs: 1
  save_every_epochs: 2
  resume: false
  device: "auto"
  pin_memory: true

optimizer:
  name: "adamw"
  lr: 1.0e-4
  weight_decay: 1.0e-4

scheduler:
  name: "warmup_cosine"
  warmup_epochs: 5
  min_lr: 1.0e-6

early_stopping:
  patience: 20
  min_delta: 1.0e-5

test:
  enabled: true
  # 独立于 data.rollout_steps；一步模型也统一测试到 8*6h=48h。
  rollout_steps: 8
  batch_size: 1
  num_workers: 0
  max_steps: null

plot:
  enabled: true
  loss_enabled: true
  loss_log_scale: true
  validation_enabled: true
  test_enabled: true
  channels: [1]             # 1-based latent channel numbers
  instruments: null         # 画图时画哪些仪器，null 表示画所有仪器
  max_future_steps: null    # 画图时，展开多少步，当然不能超过batch的预报步，null 表示画batch包含的所有步

output:
  run_name: "atmosphere_fusion"
  runs_dir: "runs"
