test_only: false

data:
  instruments:
    1bamua: "F:/lyh_data/data_latent/1bamua_latents.zarr"
  interval_hours: 6
  rollout_steps: 4       # 最远预报到 t+24h
  normalize_latents: true
  val_fraction: 0.1
  test_fraction: 0.1

model:
  atmosphere_dim: 64
  latent_levels: 2
  spatial_multiple: 9
  pressure_levels_hpa: null
  fusion_refine_blocks: 2
  swin:
    depth: 4
    num_heads: 4
    window_size: [2, 9, 9]
    mlp_ratio: 4.0
    drop: 0.0
    attn_drop: 0.0
    drop_path: 0.1

loss:
  current_reconstruction_weight: 0.1
  forecast_weight: 1.0
  use_density_mask: false
  density_threshold: 1.0e-6

train:
  training_mode: "joint"  # joint | fusion_reconstruction | forecast
  epochs: 30
  batch_size: 1          # 四步展开保存更多计算图，先减小 batch
  num_workers: 0
  max_steps_per_epoch: null
  max_validation_steps: null
  grad_clip: 1.0
  instrument_dropout: 0.15
  mixed_precision: true
  amp_dtype: "bfloat16"
  seed: 42
  deterministic: false
  validate_every_epochs: 1
  save_every_epochs: 2
  resume: false
  # 推荐填 rollout=2 阶段的 best.pth。
  finetune_from: "C:\\Users\\Lenovo\\code\\local_code\\aardvark-weather-public\\atmosphere_fusion_project\\runs\\atmosphere_fusion_rollout_2\\20260828_161309\\best.pth"
  device: "auto"
  pin_memory: true

optimizer:
  name: "adamw"
  lr: 1.0e-5
  weight_decay: 1.0e-4

scheduler:
  name: "warmup_cosine"
  warmup_epochs: 1
  min_lr: 1.0e-6

early_stopping:
  patience: 10
  min_delta: 1.0e-5

test:
  enabled: true
  rollout_steps: 8       # 所有模型统一测试到48h，可大于训练的4步
  batch_size: 1
  num_workers: 0
  max_steps: null

plot:
  enabled: true
  loss_enabled: true
  loss_log_scale: true
  validation_enabled: true
  test_enabled: true
  channels: [1]
  instruments: null
  max_future_steps: null

output:
  run_name: "atmosphere_fusion_rollout_4"
  runs_dir: "runs"
