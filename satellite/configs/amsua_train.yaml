run:
  description: "1BAMUA training run"

# true: skip training and validation, load train.resume, and run test directly
test_only: true

data:
  zarr: "F:/lyh_data/data_zarr_no_provider_filter/1bamua.zarr"
  n_context: 65000
  n_target: 17000
  target_overlap: 0.5
  val_fraction: 0.1
  test_fraction: 0.1

model:
  n_channels: 15
  point_dim: 128
  latent_dim: 128
  metadata_dim: 32
  satellite_embedding_dim: 16
  num_satellite_embeddings: 512
  include_angles: true  # encoder allow angle features
  grid_resolution_deg: 2.0
  local_radius: 1
  init_lengthscale_deg: 2.0
  use_latent_processor: true  # whether to use the latent processor (transformer)
  latent_processor_dim: 256
  latent_patch_size: 0
  latent_patch_min_height: 64
  latent_patch_min_width: 128
  latent_processor_depth: 2
  latent_processor_heads: 4
  latent_window_size: 5
  eps: 1.0e-6

train:
  epochs: 100
  batch_size: 1
  num_workers: 2
  pin_memory: true
  max_steps: null
  seed: 42
  deterministic: false
  mixed_precision: false
  amp_dtype: "float16"
  validate_every_epochs: 1
  save_every_epochs: 2
  resume: "C:\\Users\\Lenovo\\code\\local_code\\aardvark-weather-public\\runs\\bamua_training\\20260827_113942\\best.pth"

optimizer:
  name: "adamw"
  lr: 1.0e-3
  weight_decay: 1.0e-4

scheduler:
  name: "warmup_cosine"
  warmup_epochs: 2
  min_lr: 1.0e-6

early_stopping:
  patience: 8
  min_delta: 1.0e-5

test:
  enabled: true
  context_fractions: [1.0, 0.9, 0.8]
  context_chunk_size: 16384
  query_chunk_size: 16384
  max_samples: 1

plot:
  enabled: true
  loss_enabled: true
  loss_log_scale: true
  validation_enabled: true
  test_enabled: true
  channels: [1]               # 1-based brightness-temperature channel numbers
  color_std_range: 3.0        # point/global colors both use mean +/- this * std
  max_points: 100000          # 0 plots every valid point
  point_size: 3.0
  global_enabled: true
  global_resolution_deg: 0.25
  global_query_chunk_size: 16384
  global_satellite_id: 4   # null draws every satellite_id separately
  global_is_land: 0           # temporary constant metadata for the global grid

output:
  run_name: "bamua_training"
  runs_dir: "runs"

export:
  calculate_stats: true  # latent导出的zarr是否计算均值方差
  standardize_latents: true  # 是否对latent的zarr进行标准化
